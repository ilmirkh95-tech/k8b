apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: ilmir
  labels:
    app: ilmir
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ilmir
  template:
    metadata:
      labels:
        app: ilmir
    spec:
      containers:
        - name: myapp
          image: myapp:1.0
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /management/health/liveness
              port: 8080
            initialDelaySeconds: 15
            timeoutSeconds: 2
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /management/health/readiness
              port: 8080
            initialDelaySeconds: 5
            timeoutSeconds: 1
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 1
