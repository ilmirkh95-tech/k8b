apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  labels:
    app: fluentd
data:
  fluent.conf: |
    <source>
      @type tail
      path /var/log/containers/*ilmir*.log
      pos_file /var/log/fluentd-ilmir.log.pos
      tag snowflake.logs
      read_from_head true
      <parse>
        @type json
        time_key time
        time_format %Y-%m-%dT%H:%M:%S.%N%:z
      </parse>
    </source>

    <match snowflake.logs>
      @type stdout
    </match>
