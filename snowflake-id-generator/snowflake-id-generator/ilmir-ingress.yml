apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ilmir-ingress
  annotations:
    kubernetes.io/ingress.class: contour
spec:
  rules:
  - host: snowflake.dev.local
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: ilmir-service
              port:
                number: 80
