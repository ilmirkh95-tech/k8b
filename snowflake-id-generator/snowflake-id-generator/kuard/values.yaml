replicaCount: 2

image:
  repository: myapp
  tag: "1.0"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 8080
  nodePort: 30080

resources:
  requests:
    cpu: 500m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 500Gi

ingress:
  enabled: true
  className: contour
  host: snowflake.dev.local
  tls:
    enabled: true
    secretName: ilmir-tls

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  cpu:
    averageUtilization: 70
  memory:
    averageValue: 600Mi

fluentd:
  image:
    repository: fluent/fluentd
    tag: edge-debian
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: 500m
      memory: 500Mi

postgres:
  url: "jdbc:postgresql://postgres-0.postgres:5432/kuard_db"
  userConfigMap: postgres-config
  userKey: postgres-user
  passwordSecret: postgres-secrets
  passwordKey: postgres-password
